; Espia del STC-1000 (ESP32-C3 Super Mini)
; https://docs.platformio.org/page/projectconf.html

[env:esp32c3]
; misma version que compila GitHub Actions
platform = espressif32@7.1.3
board = esp32-c3-devkitm-1
framework = arduino

; FIRMWARE_VERSION sale de version.txt
extra_scripts = pre:scripts/version.py

; tabla con dos particiones de app (OTA) de 1,25 MB cada una
board_build.partitions = default.csv

monitor_speed = 115200
monitor_port = COM3
upload_port = COM3

build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
	knolleary/PubSubClient@2.8.0
	bblanchon/ArduinoJson@7.4.3
