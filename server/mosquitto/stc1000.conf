# Broker MQTT del termostato STC-1000.
# Lo usan el ESP32 (usuario stc1000) y la app Android (usuario celular).

# Cada listener tiene sus propios usuarios y ACL.
per_listener_settings true

# Los retenidos (estado, temperatura, historial...) sobreviven a reinicios.
# persistence_location ya esta en /etc/mosquitto/mosquitto.conf.
persistence true
# Guardar a disco cada 60 s (por si se corta la luz sin apagado limpio).
autosave_interval 60

# --- LAN (192.168.1.x) y Tailscale (100.x): ESP32 y celular ---
listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# --- Internet, via Tailscale Funnel (TLS en :8443 -> 127.0.0.1:1884) ---
# Solo escucha en localhost; solo existe el usuario celular.
listener 1884 127.0.0.1
allow_anonymous false
password_file /etc/mosquitto/passwd-funnel
acl_file /etc/mosquitto/acl-funnel
max_connections 10
